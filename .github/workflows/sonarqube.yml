name: SonarQube

on:
  push:
    branches:
      - main

jobs:
  sonar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov

      - name: Rodar testes com coverage
        run: |
          PYTHONPATH=. pytest --cov=src --cov-report=coverage.xml

      - name: Mostrar estrutura do projeto
        run: |
          echo "==== ROOT ===="
          ls -la
          echo "==== RECURSIVE ===="
          ls -R

      - name: Verificar se coverage existe
        run: |
          if [ -f coverage.xml ]; then
            echo "Coverage file encontrado "
          else
            echo "Coverage file NÃO encontrado "
            exit 1
          fi

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}